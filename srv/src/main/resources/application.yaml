---
logging.level:
  com.sap.cds.ai: DEBUG
  com.sap.cds.persistence.sql: DEBUG
  com.sap.cds.feature.agentmemory: DEBUG
management:
  endpoint:
    health:
      show-components: always
      probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults.enabled: false
    ping.enabled: true
    db.enabled: true
cds:
  drafts.enforce-readonly: true
  security.logPotentiallySensitive: true
  security.mock.users:
    admin:
      roles:
      - admin
  data-source.csv.paths:
  - "db/data/**"
  - "../db/data/**"
  - "target/cds/**"
  - "../target/cds/**"
  - "node_modules/@capire/**"
  - "../node_modules/@capire/**"
  - "../../node_modules/@capire/**"
---
spring:
  config.activate.on-profile: cloud
cds:
  security.mock.enabled: false # required due to AMS lib
  remote.services:
    xflights:
      type: hcql
      model: sap.capire.flights.data
      http:
        suffix: /hcql
      binding:
        name: xtravels-ias
        onBehalfOf: systemUser
        options:
          url: ${XFLIGHTS_URL} # from mta.yaml
          ias-dependency-name: data-consumer
---
spring:
  config.activate.on-profile: hybrid
  sql.init.mode: never
skip-initial-load: true
cds:
  data-source.auto-config.enabled: true
  datasource:
    csv.initialization-mode: never
  hcql.v2.enabled: true
  remote.services:
    xflights:
      type: hcql
      model: sap.capire.flights.data
      http:
        suffix: /hcql
      destination:
        properties:
          url: http://localhost:8081
          User: internal
          Password:
---
spring:
  config.activate.on-profile: hybrid-node-js
cds:
  hcql.v2.enabled: true
  remote.services:
    xflights:
      type: hcql
      model: sap.capire.flights.data
      http:
        suffix: /hcql
        service: data
      destination:
        properties:
          url: http://localhost:4005/
          User: internal
          Password:
---
spring:
  config.activate.on-profile: ollama
  sql.init.platform: h2
cds:
  datasource:
    csv.initialization-mode: always
  ai.chat.models:
    llm:
      kind: ollama
      model: gemma4:26b-mlx
    fast:
      kind: ollama
      model: gemma4:26b-mlx
      options:
        temperature: 0
    reasoning:
      kind: ollama
      model: gemma4:26b-mlx
      options:
        temperature: 0.2
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
cds:
  data-source.auto-config.enabled: false
